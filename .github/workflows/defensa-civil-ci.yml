name: Defensa Civil CI

# CI del sistema de incidentes (carpeta defensacivil). Solo corre cuando cambia esa carpeta.
on:
  push:
    branches: [main]
    paths:
      - 'defensacivil/**'
      - '.github/workflows/defensa-civil-ci.yml'
  pull_request:
    paths:
      - 'defensacivil/**'
      - '.github/workflows/defensa-civil-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: API y e2e
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -prootpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # Los tests crean y recrean la base defensacivil_test con los scripts de database/init
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: defensacivil_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            defensacivil/backend/package-lock.json
            defensacivil/frontend/package-lock.json

      - name: Instalar API
        working-directory: defensacivil/backend
        run: npm ci

      - name: Tests de la API
        working-directory: defensacivil/backend
        run: npm test

      - name: Instalar frontend
        working-directory: defensacivil/frontend
        run: npm ci

      - name: Build del frontend
        working-directory: defensacivil/frontend
        run: npm run build

      - name: Instalar Chromium
        working-directory: defensacivil/frontend
        run: npx playwright install --with-deps chromium

      - name: Tests end-to-end
        working-directory: defensacivil/frontend
        run: npm run e2e

      - name: Reporte de e2e
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: defensacivil/frontend/test-results/
          retention-days: 7

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir API
        run: docker build -f defensacivil/backend/Dockerfile.prod -t defensacivil-api:ci defensacivil/backend
      - name: Construir frontend
        run: docker build -f defensacivil/frontend/Dockerfile.prod -t defensacivil-web:ci defensacivil/frontend
