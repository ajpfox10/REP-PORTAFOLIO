name: Andromeda CI

# CI del proyecto VETERINARIAPROD (Andromeda). Solo corre cuando cambia esa carpeta.
on:
  push:
    branches: [main]
    paths:
      - 'VETERINARIAPROD/**'
      - '.github/workflows/veterinaria-ci.yml'
  pull_request:
    paths:
      - 'VETERINARIAPROD/**'
      - '.github/workflows/veterinaria-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: VETERINARIAPROD

env:
  NODE_VERSION: '20'

jobs:
  backend:
    name: Backend · tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: vetmanager_test
          MYSQL_USER: vetapp
          MYSQL_PASSWORD: testpass
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      NODE_ENV: test
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: vetmanager_test
      MYSQL_USER: vetapp
      MYSQL_PASSWORD: testpass
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_USER: vetapp
      TEST_DB_PASSWORD: testpass
      TEST_DB_NAME: vetmanager_test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: VETERINARIAPROD/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Migraciones desde cero
        run: npm run migrate

      - name: Tests unitarios, seguridad, contrato e integración
        run: npx jest tests/unit tests/security tests/contract tests/integration --forceExit --runInBand

  frontend:
    name: Frontend · tipos, build y e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VETERINARIAPROD/andromeda-front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: VETERINARIAPROD/andromeda-front/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Chequeo de tipos
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Tests end-to-end
        run: npm run e2e

      - name: Reporte de e2e
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: VETERINARIAPROD/andromeda-front/test-results/
          retention-days: 7

  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Informativo: braces (vía http-proxy-middleware) no tiene versión corregida
      # publicada. El job queda en verde y los hallazgos aparecen como advertencia.
      - name: npm audit (backend)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (frontend)
        continue-on-error: true
        working-directory: VETERINARIAPROD/andromeda-front
        run: npm audit --omit=dev --audit-level=high
