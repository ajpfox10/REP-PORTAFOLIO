  # ── Observabilidad ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./docker/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./docker/prometheus/synthetics.yml:/etc/prometheus/synthetics.yml:ro
      - prometheus-data:/prometheus
    networks: [vetmanager-internal]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks: [vetmanager-internal]
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    command:
      - '--config.file=/etc/blackbox/blackbox.yml'
    volumes:
      - ./docker/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks: [vetmanager-internal]
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

  tempo:
    image: grafana/tempo:2.5.0
    restart: unless-stopped
    command:
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./docker/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
    networks: [vetmanager-internal]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3200/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
      - tempo
    networks: [vetmanager-internal]
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
