version: '3.9'

# Producción: todos los servicios con healthchecks, restart policies, y resource limits.
# Base de datos: AWS RDS — no hay contenedor MySQL local.
# Usar con: docker compose -f docker-compose.prod.yml up -d

networks:
  vetmanager-internal:
    driver: bridge
    # Needs outbound access for RDS/S3/Stripe/OpenAI/SMTP. Edge exposure is controlled by published ports.
  vetmanager-public:
    driver: bridge    # Solo gateway tiene acceso

volumes:
  redis-data:
  prometheus-data:
  grafana-data:

services:
  # ── Cache ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks: [vetmanager-internal]
    deploy:
      resources:
        limits:
          memory: 600M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Gateway (único servicio público) ─────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "80:4050"
      - "443:4050"   # con reverse proxy nginx/traefik delante
    environment:
      NODE_ENV: production
      PORT: 4050
      TRACING_ENABLED: "true"
      TRACING_EXPORTER_URL: http://tempo:9411/api/v2/spans
      SERVICE_DISCOVERY_MODE: hybrid
      SERVICE_AUTH: http://auth:3001
      SERVICE_PATIENTS: http://patients:3002
      SERVICE_MEDICAL: http://medical:3003
      SERVICE_LAB: http://lab-imaging:3004
      SERVICE_BILLING: http://billing:3005
      SERVICE_TELEMEDICINE: http://telemedicine:3006
      SERVICE_GROOMING: http://grooming:3007
      SERVICE_REPORTS: http://reports:3008
      SERVICE_NOTIFICATIONS: http://notifications:3009
      SERVICE_PORTAL: http://portal:3010
      SERVICE_AI: http://ai:3011
      SERVICE_DOCUMENTS: http://documents:3012
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      INTERNAL_SIG_TTL_S: ${INTERNAL_SIG_TTL_S:-60}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PUBLIC_KEY_OLD: ${JWT_PUBLIC_KEY_OLD:-}
      JWT_KEYRING_JSON: ${JWT_KEYRING_JSON:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      CORS_ORIGINS: ${CORS_ORIGINS}
      CSRF_SECRET: ${CSRF_SECRET}
      CSRF_EXCLUDE_PATHS: ${CSRF_EXCLUDE_PATHS}
      DEPENDENCY_MODE_AUTH_REVOCATION: ${DEPENDENCY_MODE_AUTH_REVOCATION:-strict}
      API_VERSION: ${API_VERSION:-v1}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_DOMAIN: ${APP_DOMAIN}
      DLP_EXPORT_THRESHOLD: ${DLP_EXPORT_THRESHOLD:-1000}
      DLP_EXPORT_WINDOW_SECS: ${DLP_EXPORT_WINDOW_SECS:-300}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-10}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      WS_HEARTBEAT_INTERVAL: ${WS_HEARTBEAT_INTERVAL:-30000}
      CIRCUIT_THRESHOLD: ${CIRCUIT_THRESHOLD:-5}
      CIRCUIT_TIMEOUT_MS: ${CIRCUIT_TIMEOUT_MS:-30000}
      CIRCUIT_SUCCESS: ${CIRCUIT_SUCCESS:-2}
    depends_on:
      auth: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [vetmanager-internal, vetmanager-public]
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4050/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Servicios internos ────────────────────────────────────────────────────────
  auth:
