      HCAPTCHA_SITE_KEY: ${HCAPTCHA_SITE_KEY}
      DEVICE_FINGERPRINT_ENABLED: ${DEVICE_FINGERPRINT_ENABLED:-true}
      CSRF_EXCLUDE_PATHS: ${CSRF_EXCLUDE_PATHS}
      SLOW_QUERY_MS: ${SLOW_QUERY_MS:-500}
    depends_on:
      redis: {condition: service_healthy}
    networks: [vetmanager-internal]
    deploy:
