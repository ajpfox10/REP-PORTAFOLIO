      SERVICE_DISCOVERY_MODE: hybrid
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_POOL_MIN: ${MYSQL_POOL_MIN:-2}
      MYSQL_POOL_MAX: ${MYSQL_POOL_MAX:-20}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      INTERNAL_SIG_TTL_S: ${INTERNAL_SIG_TTL_S:-60}
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-false}
