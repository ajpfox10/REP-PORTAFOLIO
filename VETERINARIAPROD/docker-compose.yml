      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    networks:
      - vetnet

  andromeda-front:
    build:
      context: ./andromeda-front
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:4050/api/v1
        VITE_PORTAL_ORG_ID: "1"
        VITE_CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-false}
        VITE_HCAPTCHA_SITE_KEY: ${HCAPTCHA_SITE_KEY:-}
    restart: unless-stopped
    ports:
      - "5174:8080"
    networks:
      - vetnet
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    # Ports NOT exposed to host — access via gateway presigned URLs only
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    networks:
      - vetnet

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    # Port NOT exposed to host — scrape via internal network only
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./docker/prometheus/synthetics.yml:/etc/prometheus/synthetics.yml:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    networks:
      - vetnet

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - vetnet

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    command:
      - '--config.file=/etc/blackbox/blackbox.yml'
    volumes:
      - ./docker/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - vetnet

  tempo:
    image: grafana/tempo:2.5.0
    restart: unless-stopped
    command:
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./docker/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    networks:
      - vetnet

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clock-panel
    # Port NOT exposed to host — access via SSH tunnel or VPN in production
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
      - tempo
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    networks:
      - vetnet

volumes:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  vetnet:
    driver: bridge
