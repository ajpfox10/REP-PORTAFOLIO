# Base de datos: AWS RDS — no hay contenedor MySQL local.
# Todas las credenciales MYSQL_* se leen desde .env (copiar de .env.example).

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    # Port NOT exposed to host — only reachable inside vetnet
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    networks:
      - vetnet

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "4050:4050"
    env_file: .env
    environment:
      - PORT=4050
      - NODE_ENV=development
      - MYSQL_HOST=${RDS_HOST}
      - MYSQL_POOL_MAX=20
      - TRACING_ENABLED=true
      - TRACING_EXPORTER_URL=http://tempo:9411/api/v2/spans
      - SERVICE_DISCOVERY_MODE=hybrid
      - SERVICE_AUTH=http://auth:4051
      - SERVICE_PATIENTS=http://patients:4052
      - SERVICE_MEDICAL=http://medical:4053
      - SERVICE_LAB=http://lab-imaging:4054
      - SERVICE_BILLING=http://billing:4055
      - SERVICE_TELEMEDICINE=http://telemedicine:4056
      - SERVICE_GROOMING=http://grooming:4057
      - SERVICE_REPORTS=http://reports:4058
      - SERVICE_NOTIFICATIONS=http://notifications:4059
      - SERVICE_PORTAL=http://portal:3010
      - SERVICE_AI=http://ai:4061
      - SERVICE_DOCUMENTS=http://documents:4062
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4050/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
    networks:
      - vetnet

  auth:
