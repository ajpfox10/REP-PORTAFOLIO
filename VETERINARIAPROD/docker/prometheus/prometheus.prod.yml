global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/synthetics.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:3000']
    metrics_path: /metrics

  - job_name: 'auth'
    static_configs:
      - targets: ['auth:3001']
    metrics_path: /metrics

  - job_name: 'patients'
    static_configs:
      - targets: ['patients:3002']
    metrics_path: /metrics

  - job_name: 'medical'
    static_configs:
      - targets: ['medical:3003']
    metrics_path: /metrics

  - job_name: 'lab-imaging'
    static_configs:
      - targets: ['lab-imaging:3004']
    metrics_path: /metrics

  - job_name: 'billing'
    static_configs:
      - targets: ['billing:3005']
    metrics_path: /metrics

  - job_name: 'grooming'
    static_configs:
      - targets: ['grooming:3006']
    metrics_path: /metrics

  - job_name: 'reports'
    static_configs:
      - targets: ['reports:3007']
    metrics_path: /metrics

  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://gateway:3000/health/live
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
