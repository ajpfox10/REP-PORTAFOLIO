groups:
  - name: vetmanager-synthetics
    rules:
      - alert: PublicGatewayDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Public synthetic check failing"
          description: "Blackbox probe to a public VetManager endpoint failed."

      - alert: PublicGatewaySlow
        expr: probe_duration_seconds{job="blackbox-http"} > 2
        for: 10m
        labels:
          severity: medium
        annotations:
          summary: "Public synthetic check slow"
          description: "Blackbox probe duration exceeds 2 seconds."
