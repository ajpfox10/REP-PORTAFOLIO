openapi: 3.0.3
info:
  title: VetManager Pro API
  description: |
    API REST para el sistema veterinario SaaS multinacional VetManager Pro.

    **Autenticación:** Bearer JWT (access token de 15min + refresh token de 7 días)

    **Multi-tenant:** Todos los endpoints filtran datos por `branchId` del token JWT.

    **RBAC:** Cada endpoint requiere un permiso específico según el rol del usuario.
  version: "1.0.0"
  contact:
    name: VetManager Pro
    email: api@vetmanagerpro.com

servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: https://api.vetmanagerpro.com/api/v1
    description: Production
tags:
  - name: Auth
    description: Autenticación, sesiones, API keys
  - name: Clients
    description: Clientes / dueños de mascotas
  - name: Patients
    description: Pacientes (animales)
  - name: Appointments
    description: Agenda de turnos y triage de emergencias
  - name: Medical Records
    description: Historia clínica completa (HC)
  - name: Lab
    description: Laboratorio clínico
  - name: Imaging
    description: Diagnóstico por imágenes
  - name: Pathology
    description: Patología (histopatología, citología, necropsias)
  - name: Surgery
    description: Cirugías y registros anestésicos
  - name: Hospitalization
    description: Internación y monitoreo de enfermería
  - name: Vaccination
    description: Vacunaciones y desparasitaciones
  - name: Billing
    description: Facturación multi-moneda y pagos
  - name: Inventory
    description: Farmacia e inventario
  - name: Telemedicine
    description: Teleconsulta y prescripciones digitales
  - name: Grooming
    description: Peluquería y estética canina/felina
  - name: Reports
    description: Reportes ejecutivos y KPIs
  - name: Documents
    description: Casillas de correo e inbox documental
  - name: Notifications
    description: Notificaciones, recordatorios y mensajería
  - name: Portal
    description: Portal de dueños de mascotas
  - name: AI
    description: Diagnóstico asistido por IA y análisis de imágenes
  - name: Platform
    description: Salud y descubrimiento de servicios internos

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            message: { type: string }
            details: { type: array, items: { type: object } }

    Pagination:
      type: object
      properties:
        total:      { type: integer }
        page:       { type: integer }
        limit:      { type: integer }
        totalPages: { type: integer }

    Patient:
      type: object
      properties:
        id:                   { type: integer }
        name:                 { type: string, example: "Firulais" }
        speciesId:            { type: integer }
        species:              { type: string, example: "Canino" }
        breedId:              { type: integer }
        breed:                { type: string, example: "Labrador Retriever" }
        sex:                  { type: string, enum: [male, female, unknown] }
        birthdate:            { type: string, format: date }
        chipNumber:           { type: string }
        weightKg:             { type: number }
        bodyConditionScore:   { type: integer, minimum: 1, maximum: 9 }
        isNeutered:           { type: boolean }
        photoUrl:             { type: string }
        isActive:             { type: boolean }

    Client:
      type: object
      properties:
        id:             { type: integer }
        firstName:      { type: string }
        lastName:       { type: string }
        email:          { type: string, format: email }
        phone:          { type: string }
        documentType:   { type: string, enum: [dni, passport, rut, cedula, other] }
        documentNumber: { type: string }
        address:        { type: string }
        city:           { type: string }
        outstandingBalance: { type: number }

    Appointment:
      type: object
      properties:
        id:              { type: integer }
        scheduledDate:   { type: string, format: date-time }
        durationMinutes: { type: integer }
        status:          { type: string, enum: [scheduled,confirmed,in_progress,completed,cancelled,no_show] }
        patientName:     { type: string }
        ownerName:       { type: string }
        vetName:         { type: string }
        isEmergency:     { type: boolean }
        reason:          { type: string }

    PrescriptionItemInput:
      type: object
      required: [medicationName, dose, frequency]
      properties:
        medicationId:   { type: integer, minimum: 1, nullable: true }
        medicationName: { type: string, minLength: 1, maxLength: 255 }
        dose:           { type: string, minLength: 1, maxLength: 100 }
        doseUnit:       { type: string, maxLength: 50, nullable: true }
        frequency:      { type: string, minLength: 1, maxLength: 100 }
        route:          { type: string, maxLength: 50, nullable: true }
        durationDays:   { type: integer, minimum: 1, maximum: 3650, nullable: true }
        quantity:       { type: number, minimum: 0, nullable: true }
        instructions:   { type: string, maxLength: 4000, nullable: true }

    PrescriptionCreateRequest:
      type: object
      required: [items]
      properties:
        notes:   { type: string, maxLength: 4000, nullable: true }
        refills: { type: integer, minimum: 0, maximum: 12, default: 0 }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/PrescriptionItemInput'

    MedicalRecord:
      type: object
      properties:
        id:             { type: integer }
        patientId:      { type: integer }
        status:         { type: string, enum: [open, signed, amended] }
        openedAt:       { type: string, format: date-time }
        signedAt:       { type: string, format: date-time, nullable: true }
        chiefComplaint: { type: string }
        weightKg:       { type: number }
        vetName:        { type: string }

    Invoice:
      type: object
      properties:
        id:              { type: integer }
        invoiceNumber:   { type: string, example: "FAC-000042" }
        status:          { type: string, enum: [draft,pending,partial,paid,overdue,cancelled] }
        issuedDate:      { type: string, format: date }
        totalAmount:     { type: number }
        paidAmount:      { type: number }
        currency:        { type: string, example: "ARS" }
        clientName:      { type: string }

    LabOrder:
      type: object
      properties:
        id:          { type: integer }
        orderNumber: { type: string, example: "LAB000042" }
        status:      { type: string, enum: [pending,in_progress,partial,completed,cancelled] }
        priority:    { type: string, enum: [routine,urgent,stat] }
        orderedAt:   { type: string, format: date-time }
        patientName: { type: string }
        testCount:   { type: integer }

    TeleSession:
      type: object
      properties:
        id:          { type: integer }
        sessionCode: { type: string, example: "TELE-M5X2K-A3F9B2" }
        status:      { type: string, enum: [scheduled,waiting,in_progress,completed,cancelled,no_show] }
        sessionType: { type: string, enum: [consultation,follow_up,second_opinion,emergency,prescription_renewal] }
        scheduledAt: { type: string, format: date-time }
        meetingUrl:  { type: string }
        patientName: { type: string }
        vetName:     { type: string }

security:
  - BearerAuth: []
  - ApiKeyAuth: []
  # ── AUTH ────────────────────────────────────────────────────────────────────
paths:
  /csrf-token:
    get:
      summary: Obtain CSRF token
      description: |
        Endpoint de borde del gateway para obtener el token CSRF y la cookie asociada.
        Se expone en la ra?z del gateway, fuera del prefijo `/api/v1`.
      tags: [Auth]
      servers:
        - url: http://localhost:3000
          description: Local gateway root
        - url: https://api.vetmanagerpro.com
          description: Production gateway root
      responses:
        '200':
          description: CSRF token returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      csrfToken:
                        type: string
                        example: csrf-token-value
        '500':
          description: Internal server error
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string, format: email }
                password: { type: string, minLength: 6 }
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      accessToken:  { type: string }
                      refreshToken: { type: string }
                      expiresIn:    { type: string }
                      user:
                        type: object
                        properties:
                          id:       { type: integer }
                          email:    { type: string }
                          name:     { type: string }
                          orgId:    { type: integer }
                          branchId: { type: integer }
                          roles:    { type: array, items: { type: string } }
        '401': { description: Credenciales inválidas }
        '429': { description: 'Demasiados intentos, cuenta bloqueada' }

  /auth/captcha/config:
    get:
      tags: [Auth]
      summary: Obtener configuracion publica de CAPTCHA
      security: []
      responses:
        '200':
          description: Configuracion publica de CAPTCHA
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      enabled: { type: boolean }
                      provider: { type: string, nullable: true, example: hcaptcha }
                      siteKey: { type: string, nullable: true }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renovar access token
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Fallback opcional. El flujo canónico usa cookie httpOnly `refreshToken`.
      responses:
        '200': { description: Tokens renovados }
        '401': { description: Refresh token inválido o expirado }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Cerrar sesión (revoca token actual)
      responses:
        '204': { description: Sesión cerrada }

  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Cerrar todas las sesiones activas
      responses:
        '204': { description: Todas las sesiones revocadas }

  /auth/me:
    get:
      tags: [Auth]
      summary: Obtener perfil del usuario autenticado
      responses:
        '200': { description: Perfil del usuario con roles }

  /auth/sessions:
    get:
      tags: [Auth]
      summary: Listar sesiones activas
      responses:
        '200': { description: Lista de sesiones }

  /auth/sessions/{id}:
    delete:
      tags: [Auth]
      summary: Revocar una sesión específica
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Sesión revocada }

  /auth/api-keys:
    get:
      tags: [Auth]
      summary: Listar API keys del usuario
      responses:
        '200': { description: Lista de API keys }
    post:
      tags: [Auth]
      summary: Crear nueva API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:      { type: string }
                scopes:    { type: array, items: { type: string } }
                expiresAt: { type: string, format: date }
      responses:
        '201':
          description: API key creada (rawKey visible SOLO en esta respuesta)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      prefix: { type: string }
                      rawKey: { type: string }

  # ── CLIENTS ────────────────────────────────────────────────────────────────
  /clients:
    get:
      tags: [Clients]
      summary: Listar clientes de la sucursal
      parameters:
        - in: query
          name: search
          schema: { type: string }
          description: Buscar por nombre, email, teléfono o documento
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Lista paginada de clientes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Client' } }
                  meta: { $ref: '#/components/schemas/Pagination' }
    post:
      tags: [Clients]
      summary: Crear nuevo cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, phone]
              properties:
                firstName:      { type: string }
                lastName:       { type: string }
                email:          { type: string, format: email }
                phone:          { type: string }
                documentType:   { type: string, enum: [dni,passport,rut,cedula,other] }
                documentNumber: { type: string }
                address:        { type: string }
                city:           { type: string }
      responses:
        '201': { description: Cliente creado }
        '409': { description: Email o documento duplicado }

  /clients/{id}:
    get:
      tags: [Clients]
      summary: Obtener cliente con sus mascotas
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Cliente con mascotas y contactos de emergencia }
        '404': { description: Cliente no encontrado }
    put:
      tags: [Clients]
      summary: Actualizar cliente
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Actualizado }
    delete:
      tags: [Clients]
      summary: Desactivar cliente (soft delete)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Desactivado }

  # ── PATIENTS ───────────────────────────────────────────────────────────────
  /auth/admin/users:
    get:
      tags: [Auth]
      summary: Listar usuarios staff del org
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: isActive
          schema: { type: boolean }
      responses:
        '200': { description: Lista de usuarios }
    post:
      tags: [Auth]
      summary: Crear usuario staff
      responses:
        '201': { description: Usuario creado }

  /auth/admin/users/{id}/deactivate:
    patch:
      tags: [Auth]
      summary: Desactivar usuario staff
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Usuario desactivado }

  # OT-068
  /auth/admin/users/{id}/role:
    patch:
      tags: [Auth]
      summary: Cambiar rol de un usuario staff
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, example: vet }
      responses:
        '204': { description: Rol actualizado }
        '400': { description: Rol inválido }
        '404': { description: Usuario no encontrado }

  # OT-070: /auth/roles — alias público para usuarios autenticados del frontend
  /auth/roles:
    get:
      tags: [Auth]
      summary: Listar roles RBAC disponibles (alias frontend)
      description: |
        Retorna los roles estáticos con sus permisos. No requiere internal sig.
        Alias de `/auth/admin/rbac/roles` para uso desde el frontend.
      responses:
        '200':
          description: Lista de roles con permisos
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name:        { type: string }
                        permissions: { type: array, items: { type: string } }

  # ── AUTH ADMIN — RBAC ──────────────────────────────────────────────────────
  /auth/admin/rbac/roles:
    get:
      tags: [Auth]
      summary: Listar roles RBAC disponibles
      responses:
        '200': { description: Lista de roles }

  /auth/admin/rbac/orgs/{orgId}/overrides:
    get:
      tags: [Auth]
      summary: Obtener overrides de roles para una organización
      parameters:
        - in: path
          name: orgId
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Overrides de la organización }

  /auth/admin/rbac/orgs/{orgId}/roles/{role}:
    put:
      tags: [Auth]
      summary: Asignar override de rol a organización
      parameters:
        - in: path
          name: orgId
          required: true
          schema: { type: integer }
        - in: path
          name: role
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '204': { description: Override asignado }
    delete:
      tags: [Auth]
      summary: Eliminar override de rol de organización
      parameters:
        - in: path
          name: orgId
          required: true
          schema: { type: integer }
        - in: path
          name: role
          required: true
          schema: { type: string }
      responses:
        '204': { description: Override eliminado }

  /auth/admin/rbac/orgs/{orgId}/sync:
    post:
      tags: [Auth]
      summary: Sincronizar roles de organización
      parameters:
        - in: path
          name: orgId
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200': { description: Roles sincronizados }

  /auth/admin/rbac/security-alerts:
    get:
      tags: [Auth]
      summary: Listar alertas de seguridad
      responses:
        '200': { description: Lista de alertas de seguridad }

  /auth/admin/rbac/security-alerts/{id}/acknowledge:
    post:
      tags: [Auth]
      summary: Reconocer alerta de seguridad
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200': { description: Alerta reconocida }

  # ── AUTH ADMIN — POLICY ────────────────────────────────────────────────────
  /auth/admin/auth/policy:
    get:
      tags: [Auth]
      summary: Obtener política de autenticación
      responses:
        '200': { description: Política de autenticación actual }
    patch:
      tags: [Auth]
      summary: Actualizar política de autenticación
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                passwordMinLength: { type: integer }
                requireMfa:        { type: boolean }
                sessionTimeoutMin: { type: integer }
      responses:
        '200': { description: Política actualizada }

  # ── AUTH ADMIN — FEATURE FLAGS ─────────────────────────────────────────────
  /auth/admin/features/orgs/{orgId}:
    get:
      tags: [Auth]
      summary: Obtener feature flags de una organización
      parameters:
        - in: path
          name: orgId
          required: true
          schema: { type: integer }
      responses:
        '200': { description: 'Flags, definiciones y valores por defecto' }
    patch:
      tags: [Auth]
      summary: Actualizar feature flags de una organización
      parameters:
        - in: path
          name: orgId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flags]
              properties:
                flags: { type: object, additionalProperties: { type: boolean } }
      responses:
        '200': { description: Flags actualizados }

  # ── AUTH ADMIN — RBAC EFFECTIVE ────────────────────────────────────────────
  /auth/admin/rbac/orgs/{orgId}/roles/{role}/effective:
    get:
      tags: [Auth]
      summary: Permisos efectivos de un rol para una organización (base + overrides)
      parameters:
        - in: path
          name: orgId
          required: true
          schema: { type: integer }
        - in: path
          name: role
          required: true
          schema: { type: string }
      responses:
        '200': { description: Lista de permisos efectivos }

  # ── AUTH AUDIT ─────────────────────────────────────────────────────────────
  /auth/audit/export:
    get:
      tags: [Auth]
      summary: Exportar logs de auditoría
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: format
          schema: { type: string, enum: [json, csv] }
        - in: query
          name: userId
          schema: { type: integer }
        - in: query
          name: action
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        '200': { description: Logs de auditoría exportados }

  # ── AUTH ADMIN — TABLE PREVIEW ─────────────────────────────────────────────
  /auth/admin/preview:
    get:
      tags: [Auth]
      summary: Listar tablas disponibles para preview de datos
      responses:
        '200': { description: Lista de tablas con metadatos }

  /auth/admin/preview/{tableName}:
    get:
      tags: [Auth]
      summary: Preview de una tabla (columnas + 10 filas)
      parameters:
        - in: path
          name: tableName
          required: true
          schema: { type: string }
      responses:
        '200': { description: Esquema y datos de la tabla }
        '404': { description: Tabla no disponible }

  /patients:
    get:
      tags: [Patients]
      summary: Listar pacientes
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: speciesId
          schema: { type: string, pattern: '^[0-9]+$' }
        - in: query
          name: species
          schema: { type: string }
        - in: query
          name: isActive
          schema: { type: string, enum: ['true', 'false', 'all'], default: 'true' }
        - in: query
          name: is_active
          schema: { oneOf: [{ type: string, enum: ['true', 'false', 'all'] }, { type: integer, enum: [0, 1] }] }
        - in: query
          name: page
          schema: { type: string, pattern: '^[0-9]+$' }
        - in: query
          name: limit
          schema: { type: string, pattern: '^[0-9]+$' }
      responses:
        '200': { description: Lista paginada de pacientes }
    post:
      tags: [Patients]
      summary: Crear nuevo paciente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, speciesId, sex, primaryOwnerId]
              properties:
                name:           { type: string }
                speciesId:      { type: integer }
                breedId:        { type: integer }
                sex:            { type: string, enum: [male, female, unknown] }
                birthdate:      { type: string, format: date }
                chipNumber:     { type: string }
                weightKg:       { type: number }
                primaryOwnerId: { type: integer }
      responses:
        '201': { description: Paciente creado }

  /patients/{id}:
    get:
      tags: [Patients]
      summary: Obtener paciente completo (con dueños, alergias, condiciones crónicas)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Paciente completo }
    put:
      tags: [Patients]
      summary: Actualizar datos del paciente
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Actualizado }
    # OT-066: soft delete — conserva historia clínica, desactiva is_active
    delete:
      tags: [Patients]
      summary: Dar de baja al paciente (soft delete)
      description: |
        Marca al paciente como inactivo (is_active = false). La historia clínica
        y todos los registros médicos se conservan. Para baja definitiva usar GDPR.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Paciente dado de baja }
        '404': { description: Paciente no encontrado }

  /patients/{id}/timeline:
    get:
      tags: [Patients]
      summary: Historial cronológico completo del paciente
      description: Devuelve todos los eventos clínicos (turnos, HC, vacunas, cirugías, internaciones, teleconsultas, grooming) ordenados por fecha.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Timeline completo del paciente }

  /patients/{id}/owners:
    post:
      tags: [Patients]
      summary: Agregar co-dueño al paciente
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [clientId, ownershipType]
              properties:
                clientId:      { type: integer }
                ownershipType: { type: string, enum: [secondary, temporary_guardian, foster] }
      responses:
        '201': { description: Co-dueño agregado }

  # ── APPOINTMENTS ───────────────────────────────────────────────────────────
  /patients/species/all:
    get:
      tags: [Patients]
      summary: Listar especies de referencia
      responses:
        '200': { description: Lista de especies }

  /species/all:
    get:
      tags: [Patients]
      summary: Listar especies de referencia (alias)
      responses:
        '200': { description: Lista de especies }

  /patients/breeds/all:
    get:
      tags: [Patients]
      summary: Listar razas de referencia
      parameters:
        - in: query
          name: speciesId
          schema: { type: integer }
      responses:
        '200': { description: Lista de razas }

  /breeds/all:
    get:
      tags: [Patients]
      summary: Listar razas de referencia (alias)
      parameters:
        - in: query
          name: speciesId
          schema: { type: integer }
      responses:
        '200': { description: Lista de razas }

  /appointments:
    get:
      tags: [Appointments]
      summary: Listar turnos
      parameters:
        - in: query
          name: date
          schema: { type: string, format: date }
        - in: query
          name: vetId
          schema: { type: integer }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: patientId
          schema: { type: integer }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200': { description: Lista de turnos }
    post:
      tags: [Appointments]
      summary: Crear turno
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patientId, vetId, scheduledDate]
              properties:
                patientId:         { type: integer }
                vetId:             { type: integer }
                scheduledDate:     { type: string, format: date-time }
                durationMinutes:   { type: integer, default: 30 }
                appointmentTypeId: { type: integer }
                reason:            { type: string }
                isEmergency:       { type: boolean }
      responses:
        '201': { description: Turno creado }

  /appointments/today:
    get:
      tags: [Appointments]
      summary: Turnos del día (vista agenda)
      responses:
        '200': { description: Agenda del día ordenada por hora }

  /appointments/types:
    get:
      tags: [Appointments]
      summary: Tipos de turno disponibles
      responses:
        '200': { description: Lista de tipos de turno }

  /appointments/{id}:
    put:
      tags: [Appointments]
      summary: Actualizar turno completo (OT-065)
      description: Actualiza uno o más campos del turno. Todos los campos son opcionales.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                scheduledDate:     { type: string, format: date-time }
                durationMinutes:   { type: integer, minimum: 5, maximum: 480 }
                status:            { type: string, enum: [scheduled,confirmed,in_progress,completed,cancelled,no_show] }
                vetId:             { type: integer }
                reason:            { type: string }
                notes:             { type: string }
                appointmentTypeId: { type: integer }
      responses:
        '204': { description: Turno actualizado }
        '400': { description: Sin campos para actualizar }
        '404': { description: Turno no encontrado }

  /appointments/{id}/status:
    patch:
      tags: [Appointments]
      summary: Cambiar estado del turno
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [scheduled,confirmed,in_progress,completed,cancelled,no_show] }
      responses:
        '204': { description: Estado actualizado }

  # OT-063: /appointments/{id}/triage no existe en el backend.
  # La ruta canónica es POST /triage/{id} (medical service).
  # Se elimina esta entrada para evitar confusión; ver /triage/{id} más abajo.

  # ── MEDICAL RECORDS ────────────────────────────────────────────────────────
  /medical-records:
    get:
      tags: [Medical Records]
      summary: Listar historias clínicas
      parameters:
        - in: query
          name: patientId
          schema: { type: integer }
        - in: query
          name: status
          schema: { type: string, enum: [open, signed, amended] }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200': { description: Lista de HCs }
    post:
      tags: [Medical Records]
      summary: Abrir nueva historia clínica
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [appointmentId, chiefComplaint]
                  properties:
                    appointmentId:      { type: integer }
                    chiefComplaint:     { type: string }
                    reasonForVisit:     { type: string }
                    visitDate:          { type: string, format: date }
                    notes:              { type: string }
                    weightKg:           { type: number }
                    bodyConditionScore: { type: number }
                    temperatureC:       { type: number }
                - type: object
                  required: [patientId, chiefComplaint]
                  properties:
                    patientId:          { type: integer }
                    chiefComplaint:     { type: string }
                    reasonForVisit:     { type: string }
                    visitDate:          { type: string, format: date }
                    notes:              { type: string }
                    weightKg:           { type: number }
                    bodyConditionScore: { type: number }
                    temperatureC:       { type: number }
      responses:
        '201': { description: HC abierta }

  /medical-records/{id}:
    get:
      tags: [Medical Records]
      summary: Obtener HC completa (anamnesis, examen físico, diagnósticos, tratamientos, recetas)
      responses:
        '200': { description: HC completa }

  /medical-records/{id}/sign:
    post:
      tags: [Medical Records]
      summary: Firmar / cerrar historia clínica
      description: Valida que tenga anamnesis y al menos un diagnóstico antes de firmar. Una vez firmada no puede editarse.
      responses:
        '200': { description: HC firmada exitosamente }
        '400': { description: HC incompleta - falta anamnesis o diagnóstico }

  /medical-records/{id}/anamnesis:
    post:
      tags: [Medical Records]
      summary: Guardar anamnesis
      responses:
        '201': { description: Anamnesis guardada }

  /medical-records/{id}/physical-exam:
    post:
      tags: [Medical Records]
      summary: Guardar examen físico
      responses:
        '201': { description: Examen guardado }

  /medical-records/{id}/diagnoses:
    post:
      tags: [Medical Records]
      summary: Agregar diagnóstico
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [diagnosisName, diagnosisType]
              properties:
                diagnosisName:  { type: string }
                diagnosisType:  { type: string, enum: [definitive,presumptive,differential,rule_out] }
                diagnosisCode:  { type: string, description: "Código CIE o SNOMED" }
                isPrimary:      { type: boolean }
                prognosis:      { type: string, enum: [excellent,good,fair,guarded,poor,grave] }
      responses:
        '201': { description: Diagnóstico agregado }

  /medical-records/{id}/treatments:
    post:
      tags: [Medical Records]
      summary: Agregar tratamiento
      responses:
        '201': { description: Tratamiento agregado }

  /medical-records/{id}/prescriptions:
    post:
      tags: [Medical Records]
      summary: Crear receta médica
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrescriptionCreateRequest'
      responses:
        '201': { description: Receta creada }

  # ── LAB ────────────────────────────────────────────────────────────────────
  /rules:
    get:
      tags: [Medical Rules]
      summary: Listar reglas clinicas y operativas
      responses:
        '200': { description: Lista de reglas }
    post:
      tags: [Medical Rules]
      summary: Crear regla clinica u operativa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule_type, name, conditions]
              properties:
                rule_type: { type: string, enum: [appointment_restriction,capacity_limit,clinical_alert,invoice_rule] }
                name: { type: string }
                description: { type: string }
                branch_id: { type: integer, nullable: true }
                conditions:
                  type: array
                  items: { type: object }
                action: { type: string, enum: [block,warn,alert], default: warn }
                action_message: { type: string }
                priority: { type: integer }
      responses:
        '201': { description: Regla creada }

  /rules/{id}:
    put:
      tags: [Medical Rules]
      summary: Actualizar regla
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Regla actualizada }
    delete:
      tags: [Medical Rules]
      summary: Desactivar regla
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Regla desactivada }

  /rules/evaluate:
    post:
      tags: [Medical Rules]
      summary: Evaluar reglas
      responses:
        '200': { description: Resultado de evaluacion }

  # -- LAB -------------------------------------------------------------------
  /lab/orders:
    get:
      tags: [Lab]
      summary: Listar órdenes de laboratorio
      parameters:
        - { in: query, name: patientId, schema: { type: integer } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: Lista de órdenes }
    post:
      tags: [Lab]
      summary: Crear orden de laboratorio
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [patientId, tests]
              properties:
                patientId:       { type: integer }
                medicalRecordId: { type: integer }
                tests:
                  type: array
                  description: "IDs de lab_tests o items con testId"
                  items:
                    oneOf:
                      - type: integer
                      - type: object
                        required: [testId]
                        properties:
                          testId: { type: integer }
                priority:        { type: string, enum: [routine,urgent,stat], default: routine }
      responses:
        '201': { description: Orden creada con número auto-generado }

  /lab/orders/pending:
    get:
      tags: [Lab]
      summary: Resultados pendientes de informar
      responses:
        '200': { description: Órdenes sin resultados completos }

  /lab/orders/{id}/results:
    post:
      tags: [Lab]
      summary: Cargar resultados (técnico de laboratorio)
      description: Auto-detecta valores críticos y dispara alertas. Busca rangos de referencia por especie/sexo.
      responses:
        '201': { description: Resultados cargados. Alertas generadas si hay valores críticos. }

  /lab/orders/{id}:
    get:
      tags: [Lab]
      summary: Obtener detalle de una orden de laboratorio
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Orden con items y resultados }
        '404': { description: Orden no encontrada }

  /lab/tests:
    get:
      tags: [Lab]
      summary: Catálogo de análisis de laboratorio disponibles
      parameters:
        - in: query
          name: categoryId
          schema: { type: integer }
        - in: query
          name: search
          schema: { type: string }
      responses:
        '200': { description: Lista de análisis activos con categoría y precio }

  /lab/panels:
    get:
      tags: [Lab]
      summary: Paneles de análisis (conjuntos predefinidos)
      responses:
        '200': { description: Lista de paneles activos con análisis incluidos }

  # ── IMAGING ────────────────────────────────────────────────────────────────
  /pathology/orders:
    get:
      tags: [Lab]
      summary: Listar Ã³rdenes de patologÃ­a
      parameters:
        - in: query
          name: patientId
          schema: { type: integer }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200': { description: Lista de Ã³rdenes de patologÃ­a }
    post:
      tags: [Pathology]
      summary: Crear orden de patología
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patientId, pathologyTypeId]
              properties:
                patientId:        { type: integer }
                medicalRecordId:  { type: integer }
