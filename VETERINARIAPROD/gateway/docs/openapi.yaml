  /follow-ups:
    get:
      tags: [Telemedicine]
      summary: Listar sesiones de seguimiento (follow-up)
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [scheduled,waiting,in_progress,completed,cancelled,no_show] }
        - in: query
          name: vetId
          schema: { type: integer }
        - in: query
          name: patientId
          schema: { type: integer }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200': { description: Lista paginada de follow-ups }
    post:
      tags: [Telemedicine]
      summary: Crear sesión de seguimiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patientId, clientId, vetId, scheduledAt]
              properties:
                patientId:       { type: integer }
                clientId:        { type: integer }
                vetId:           { type: integer }
                scheduledAt:     { type: string, format: date-time }
                platformId:      { type: integer, nullable: true }
                durationMinutes: { type: integer, default: 30 }
                chiefComplaint:  { type: string }
                notes:           { type: string }
      responses:
        '201':
          description: Follow-up creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:          { type: integer }
                  sessionCode: { type: string }
                  sessionType: { type: string, example: follow_up }

