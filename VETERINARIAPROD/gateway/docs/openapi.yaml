  # OT-064
  /health/deep:
    get:
      tags: [Platform]
      summary: Health check profundo (DB, Redis, dependencias externas)
      description: |
        Verifica conectividad con MySQL, Redis, Stripe, MercadoPago y OpenAI.
        Retorna `status: healthy | degraded | unhealthy` por componente.
      security: []
      responses:
        '200':
          description: Health check completado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [healthy, degraded, unhealthy] }
                  checks:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        status: { type: string }
                        latencyMs: { type: number }
        '503': { description: Servicio degradado o no disponible }

