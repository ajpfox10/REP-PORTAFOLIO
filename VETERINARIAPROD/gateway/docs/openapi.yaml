                clinicalHistory:  { type: string }
                samples:
                  type: array
                  items:
                    type: object
                    properties:
                      sampleType:             { type: string }
                      anatomicalLocation:     { type: string }
                      collectionDate:         { type: string, format: date }
                      fixationMethod:         { type: string }
                      macroscopicDescription: { type: string }
                sampleDescription: { type: string }
                priority:         { type: string, enum: [routine, urgent, stat], default: routine }
      responses:
        '201': { description: Orden de patología creada }

  /pathology/types:
    get:
      tags: [Lab]
      summary: CatÃ¡logo de tipos de patologÃ­a
      responses:
        '200': { description: Lista de tipos de patologÃ­a }

  # OT-067: GET /imaging → redirect 307 a /imaging/orders (backend alias)
  /imaging:
    get:
      tags: [Imaging]
      summary: Listar órdenes de imágenes (alias de /imaging/orders)
      description: Redirige a `/imaging/orders`. Usar `/imaging/orders` directamente.
      deprecated: true
      responses:
        '307': { description: Redirect a /imaging/orders }
        '200': { description: Lista de órdenes (si el cliente sigue el redirect) }

  /imaging/orders:
    get:
      tags: [Imaging]
      summary: Listar órdenes de imágenes
      parameters:
        - in: query
          name: patientId
          schema: { type: integer }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200': { description: Lista de órdenes }
    post:
      tags: [Imaging]
      summary: Crear orden de imágenes
      responses:
        '201': { description: Orden creada }

  /imaging/orders/{id}/studies:
    post:
      tags: [Imaging]
      summary: Registrar estudio realizado con URLs de imágenes (PACS/DICOM)
      description: Almacena solo la URL externa del PACS. No sube imágenes a esta API.
      responses:
        '201': { description: Estudio registrado }

  /imaging/orders/{id}/report:
    post:
      tags: [Imaging]
      summary: Cargar informe radiológico
      responses:
        '201': { description: Informe cargado }

  # ── SURGERY ────────────────────────────────────────────────────────────────
  /surgeries:
    get:
      tags: [Surgery]
      summary: Listar cirugías
      parameters:
        - { in: query, name: patientId, schema: { type: integer } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: Lista de cirugías }
    post:
      tags: [Surgery]
      summary: Programar cirugía
      responses:
        '201': { description: Cirugía programada }

  /surgeries/{id}/status:
    patch:
      tags: [Surgery]
      summary: Actualizar estado de cirugía (incluye hora inicio/fin, diagnóstico postoperatorio)
      responses:
        '204': { description: Estado actualizado }

  /surgeries/{id}/anesthesia:
    post:
      tags: [Surgery]
      summary: Registrar protocolo anestésico
      responses:
        '201': { description: Registro anestésico guardado }

  # ── HOSPITALIZATION ────────────────────────────────────────────────────────
  /hospitalizations:
    get:
      tags: [Hospitalization]
      summary: Listar internaciones
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [active, discharged, all], default: active } }
        - { in: query, name: patientId, schema: { type: integer } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 30 } }
      responses:
        '200': { description: Lista de internaciones }
    post:
      tags: [Hospitalization]
      summary: Ingresar paciente a internación
      description: Verifica disponibilidad de kennel. Usa sp_admit_hospitalization.
      responses:
        '201': { description: Paciente ingresado }
        '409': { description: Kennel no disponible }

  /hospitalizations/board:
    get:
      tags: [Hospitalization]
      summary: Pizarrón de enfermería (todos los internados con últimos vitales)
      responses:
        '200': { description: Vista del pizarrón de internación }

  /hospitalizations/{id}/monitoring:
    post:
      tags: [Hospitalization]
      summary: Registrar control de enfermería
      description: Dispara alerta si detecta valores críticos (hipotermia, taquicardia, etc.)
      responses:
        '201': { description: Control registrado. Alerta si hay valores críticos. }

  /hospitalizations/{id}/discharge:
    patch:
      tags: [Hospitalization]
      summary: Dar de alta al paciente
      responses:
        '200': { description: Alta registrada }

  /hospitalizations/wards/availability:
    get:
      tags: [Hospitalization]
      summary: Disponibilidad de kennels por área
      responses:
        '200': { description: Mapa de disponibilidad de kennels }

  # ── VACCINATION ────────────────────────────────────────────────────────────
  /vaccinations:
    get:
      tags: [Vaccination]
      summary: Historial de vacunas
      responses:
        '200': { description: Lista de vacunaciones }
    post:
      tags: [Vaccination]
      summary: Registrar vacuna aplicada
      description: Auto-genera recordatorio para próxima dosis.
      responses:
        '201': { description: Vacuna registrada }

  /vaccinations/alerts:
    get:
      tags: [Vaccination]
      summary: Alertas de vacunas vencidas o por vencer (30 días)
      responses:
        '200': { description: Lista de alertas }

  /vaccinations/vaccines:
    get:
      tags: [Vaccination]
      summary: Catalogo de vacunas
      parameters:
        - in: query
          name: speciesId
          schema: { type: integer }
      responses:
        '200': { description: Lista de vacunas }

  /vaccinations/deworming:
    get:
      tags: [Vaccination]
      summary: Historial de desparasitaciones
      parameters:
        - in: query
          name: patientId
          schema: { type: integer }
      responses:
        '200': { description: Lista }
    post:
      tags: [Vaccination]
      summary: Registrar desparasitación
      responses:
        '201': { description: Registrado }

  # ── BILLING ────────────────────────────────────────────────────────────────
  /vaccinations/deworming/products:
    get:
      tags: [Vaccination]
      summary: Catalogo de antiparasitarios
      responses:
        '200': { description: Lista de productos antiparasitarios }

  /invoices:
    get:
      tags: [Billing]
      summary: Listar facturas
      parameters:
        - in: query
          name: page
          schema:
            type: string
            pattern: '^[0-9]+$'
        - in: query
          name: limit
          schema:
            type: string
            pattern: '^[0-9]+$'
        - in: query
          name: status
          schema: { type: string, enum: [draft,pending,partial,paid,overdue,cancelled] }
        - in: query
          name: clientId
          schema:
            type: string
            pattern: '^[0-9]+$'
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200': { description: Lista paginada de facturas }
    post:
      tags: [Billing]
      summary: Crear factura
      description: Usa sp_generate_invoice. Numeración auto-correlativa por sucursal.
      responses:
        '201': { description: Factura creada }

  /invoices/{id}:
    get:
      tags: [Billing]
      summary: Obtener factura completa con items y pagos
      responses:
        '200': { description: Factura completa }

  /invoices/{id}/pay:
    patch:
      tags: [Billing]
      summary: Marcar factura como pagada
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_method: { type: string, enum: [cash,credit_card,debit_card,bank_transfer,check,crypto,other] }
                paymentMethod:  { type: string, enum: [cash,credit_card,debit_card,bank_transfer,check,crypto,other] }
                reference:      { type: string }
                notes:          { type: string }
      responses:
        '200': { description: Factura pagada }

  /invoices/{id}/cancel:
    patch:
      tags: [Billing]
      summary: Cancelar factura
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '204': { description: Factura cancelada }

  /invoices/aging:
    get:
      tags: [Billing]
      summary: Reporte de aging (facturas vencidas por rango)
      responses:
        '200': { description: Aging report }

  /payments:
    # OT-062: GET / — listar pagos del branch (opcional: filtrar por invoiceId)
    get:
      tags: [Billing]
      summary: Listar pagos del branch
      parameters:
        - in: query
          name: invoiceId
          schema: { type: integer }
          description: Filtrar por factura
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
