apiVersion: apps/v1
kind: Deployment
metadata:
  name: vetmanager-billing
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: vetmanager-billing
  template:
    metadata:
      labels:
        app: vetmanager-billing
    spec:
      serviceAccountName: vetmanager-billing
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: billing
          image: ghcr.io/ajpfox10/veterinaria-billing:81c52c17
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: vetmanager-config
            - secretRef:
                name: vetmanager-secrets
          env:
            - name: PORT
              value: "3005"
          ports:
            - containerPort: 3005
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3005
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3005
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: vetmanager-billing
spec:
  selector:
    app: vetmanager-billing
  ports:
    - port: 3005
      targetPort: 3005
