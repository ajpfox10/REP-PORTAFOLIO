apiVersion: v1
kind: ConfigMap
metadata:
  name: vetmanager-config
data:
  NODE_ENV: production
  API_VERSION: v1
  APP_VERSION: "1.0.0"
  TZ: America/Argentina/Buenos_Aires
  APP_URL: https://api.vetmanager.io
  FRONTEND_URL: https://app.vetmanager.io
  ALLOWED_HOSTS: api.vetmanager.io
  ALLOWED_ORIGINS: https://app.vetmanager.io
  CORS_ORIGINS: https://app.vetmanager.io
  SERVICE_DISCOVERY_MODE: env
  OPENAPI_VALIDATE: "true"
  TRACING_ENABLED: "true"
  MYSQL_PORT: "3306"
  MYSQL_POOL_MAX: "20"
  REDIS_CONNECT_TIMEOUT_MS: "3000"
  INTERNAL_SIG_TTL_S: "60"
  JWT_ACCESS_EXPIRES: 15m
  JWT_REFRESH_EXPIRES: 7d
  AUTH_COOKIE_SECURE: "true"
  AUTH_COOKIE_SAME_SITE: none
  CSRF_EXCLUDE_PATHS: /health,/metrics,/api/v1/auth/login,/api/v1/auth/refresh,/api/v1/auth/password-reset/request,/api/v1/auth/password-reset/confirm,/api/v1/payments/mp/webhook,/api/v1/payments/stripe/webhook
  DEPENDENCY_MODE_AUTH_REVOCATION: strict
  DEPENDENCY_MODE_INTERNAL_AUTH: strict
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "true"
  MINIO_BUCKET_PATIENTS: patient-files
  MINIO_BUCKET_GROOMING: grooming-photos
  MINIO_BUCKET_TELE: tele-docs
  MINIO_BUCKET_DOCUMENTS: documents-inbox
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SERVICE_AUTH: http://vetmanager-auth:3001
  SERVICE_PATIENTS: http://vetmanager-patients:3002
  SERVICE_MEDICAL: http://vetmanager-medical:3003
  SERVICE_LAB: http://vetmanager-lab-imaging:3004
  SERVICE_BILLING: http://vetmanager-billing:3005
  SERVICE_TELEMEDICINE: http://vetmanager-telemedicine:3006
  SERVICE_GROOMING: http://vetmanager-grooming:3007
  SERVICE_REPORTS: http://vetmanager-reports:3008
  SERVICE_NOTIFICATIONS: http://vetmanager-notifications:3009
  SERVICE_PORTAL: http://vetmanager-portal:3010
  SERVICE_AI: http://vetmanager-ai:4061
  SERVICE_DOCUMENTS: http://vetmanager-documents:3012
