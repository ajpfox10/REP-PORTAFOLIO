# OT-114: Ingress with TLS — terminates HTTPS at the Ingress controller.
#
# Requirements:
#   - ingress-nginx controller deployed in the cluster
#   - cert-manager installed for automatic Let's Encrypt certificate management
#   - DNS A record for INGRESS_DOMAIN pointing to the Ingress controller's external IP
#
# Setup:
#   1. Install cert-manager:
#        kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
#   2. Create a ClusterIssuer for Let's Encrypt (see cert-manager docs)
#   3. Set INGRESS_DOMAIN env var or replace manually below.
#
# The ClusterIssuer 'letsencrypt-prod' must exist before applying this manifest.
# For staging/testing, replace with 'letsencrypt-staging' to avoid rate limits.

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vetmanager-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    # OT-114: cert-manager issues and auto-renews the TLS certificate
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Security headers
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    # HSTS
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
spec:
  tls:
    - hosts:
        - api.vetmanagerpro.com        # replace with actual domain
      secretName: vetmanager-tls-cert  # cert-manager will populate this
  rules:
    - host: api.vetmanagerpro.com      # replace with actual domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vetmanager-gateway
                port:
                  number: 80
