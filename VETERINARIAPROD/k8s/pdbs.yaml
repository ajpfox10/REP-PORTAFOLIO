# OT-117: PodDisruptionBudgets for all critical services.
# minAvailable: 1 ensures at least one pod stays running during node drains
# and voluntary disruptions (rolling updates, cluster upgrades).
# For services with replicas=1 (single-instance), this prevents full downtime
# during maintenance windows.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdb-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: vetmanager-gateway
---
