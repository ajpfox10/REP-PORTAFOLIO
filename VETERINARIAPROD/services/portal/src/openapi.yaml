openapi: '3.0.3'
info:
  title: VetManager Portal Service
  version: '1.0.0'
servers:
  - url: /
paths:
  /health:
    get:
      responses:
        '200':
          description: OK
  /portal/auth/register:
    post:
      responses:
        '201':
          description: Created
  /portal/auth/login:
    post:
      responses:
        '200':
          description: OK
  /portal/auth/refresh:
    post:
      responses:
        '200':
          description: OK
  /portal/auth/forgot-password:
    post:
      responses:
        '200':
          description: OK
  /portal/auth/password-reset/confirm:
    post:
      responses:
        '200':
          description: OK
  /portal/auth/reset-password:
    post:
      responses:
        '200':
          description: OK
  /portal/me:
    get:
      responses:
        '200':
          description: OK
    put:
      responses:
        '204':
          description: No content
  /portal/me/password:
    put:
      responses:
        '200':
          description: OK
  /portal/pets:
    get:
      responses:
        '200':
          description: OK
  /portal/pets/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
  /portal/pets/{id}/medical-history:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
  /portal/pets/{id}/vaccinations:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
  /portal/pets/{id}/prescriptions:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
  /portal/appointments:
    get:
      responses:
        '200':
          description: OK
    post:
      responses:
        '201':
          description: Created
  /portal/appointments/{id}/cancel:
    patch:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: No content
  /portal/invoices:
    get:
      responses:
        '200':
          description: OK
  /portal/invoices/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
  /portal/invoices/{id}/pay:
    post:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
  /portal/notifications:
    get:
      responses:
        '200':
          description: OK
  /portal/notifications/{id}/read:
    patch:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: No content
  /portal/fcm/register:
    post:
      responses:
        '200':
          description: OK
  /portal/telemedicine:
    get:
      responses:
        '200':
          description: OK
